apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dora.fullname" . }}-config
  labels:
    {{- include "dora.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXTAUTH_URL: {{ include "dora.nextauthUrl" . | quote }}
  {{- with .Values.config.serverActionsAllowedOrigins }}
  SERVER_ACTIONS_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  {{- if .Values.config.anonAccess }}
  DORA_ANON_ACCESS: "true"
  {{- end }}
