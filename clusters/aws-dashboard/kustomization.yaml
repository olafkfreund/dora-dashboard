apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Reconciled by the Flux Kustomization that `flux bootstrap` creates for this
# path (clusters/aws-dashboard). Manages only the Git source + HelmRelease —
# the `dora` namespace is deliberately left out so Flux can never prune it.
resources:
  - gitrepository.yaml
  - helmrelease.yaml
