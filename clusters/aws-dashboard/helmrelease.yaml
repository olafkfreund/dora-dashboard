apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dora-dashboard
  namespace: flux-system
spec:
  interval: 10m
  # Adopt the EXISTING manual release in place — same name + namespace, so
  # helm-controller upgrades the current release rather than creating a new one.
  releaseName: dora-dashboard
  targetNamespace: dora
  storageNamespace: dora
  chart:
    spec:
      chart: ./charts/dora-dashboard
      sourceRef:
        kind: GitRepository
        name: dora-dashboard
        namespace: flux-system
      # Layer the AWS overrides over the chart defaults. valuesFiles are resolved
      # relative to the SourceRef (repo) ROOT — not the chart path — and the chart's
      # own values.yaml is NOT auto-included, so list it explicitly first.
      # image.tag (6157572) lives in values-aws.yaml — bump it there via a git
      # commit to release a new build.
      valuesFiles:
        - charts/dora-dashboard/values.yaml
        - charts/dora-dashboard/values-aws.yaml
      # Revision (NOT ChartVersion): the image tag lives in a values FILE, so the
      # Chart.yaml version never bumps on a promotion. Revision appends the git
      # revision to the packaged chart version, so every commit that changes the
      # tag produces a new chart version and helm-controller actually rolls it out.
      reconcileStrategy: Revision
  # secrets.databaseUrl is intentionally left empty (chart default). The chart's
  # secret template preserves the live in-cluster Secret (RDS DATABASE_URL,
  # AUTH_SECRET, APP_ENCRYPTION_KEY, ...) via `lookup`, so nothing is lost on
  # adoption. Migrate these to External Secrets Operator / SOPS later — see README.
  install:
    # Do NOT create the dora namespace here — it pre-exists and is owned outside Flux.
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    # Keep the last-known-good release if an upgrade fails to go Ready.
    cleanupOnFail: true
